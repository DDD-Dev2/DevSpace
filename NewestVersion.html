    <script src="https://cdnjs.cloudflare.com/ajax/libs/eruda/3.4.3/eruda.js"></script>
    <a style="position: absolute; left:-9999px;" id="downloadLink" href="about:blank" download="Dev-SpaceSingleFile.html">a</a>
    <script>
      async function loadExternalAssets(baseUrl) {
        //const baseUrl = 'https://fastly.jsdelivr.net/gh/DDD-Dev2/DevSpace@main/';
        const timestamp = `?t=${Date.now()}`;
        //set dubug menu url
        block = document.getElementById("debugUrlCodeBlock");
        block.innerHTML = baseUrl;
        //console.log(baseUrl);
        const files = [{
            id: 'version',
            url: `https://fastly.jsdelivr.net/gh/DDD-Dev2/DevSpace@main/HtmlVersion.txt${timestamp}`
          },
          {
            id: 'popout',
            url: `${baseUrl}popoutText.txt${timestamp}`
          },
          {
            id: 'mainMsg',
            url: `${baseUrl}mainMessage.txt${timestamp}`
          }
        ];
        try {
          const results = await Promise.all(files.map(file =>
            fetch(file.url).then(res => res.text())
           //fetch('https://example.com', {method: 'GET',headers: {'Accept': 'text/html'}}).then(res => res.text())
          ));
          const [versionData, popoutData, mainMsgData] = results.map(t => t.trim());
          window.HtmlVersion = "5";
          window.NewestHtmlVers = versionData;
          const infoText = document.getElementById("mainInfoText");
          if (infoText) {
            infoText.innerHTML = `
                        Info: <br><br> 
                        Press Shift + \\ to open panic mode. <br> 
                        Current Version: ${window.HtmlVersion} | Newest: ${window.NewestHtmlVers}<br><br>
                        This site is not affiliated with any activities included...
                    `;
          }
          if (versionData !== window.HtmlVersion) {
            if (confirm("New version available! Download now?")) {
              const updateRes = await fetch(`${baseUrl}NewestVersion.html${timestamp}`);
              const blob = new Blob([await updateRes.text()], {
                type: "text/html"
              });
              const link = document.getElementById("downloadLink");
              link.href = URL.createObjectURL(blob);
              link.click();
            }
          }
          const popText = document.getElementById("popText");
          if (popText) popText.textContent = popoutData;
          const mainText = document.getElementById("mainText");
          if (mainText) mainText.innerHTML = mainMsgData;
        } catch (error) {
