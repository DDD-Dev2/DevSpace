      /* HTML: <div class="loader"></div> */
      .loader {
        width: 80px;

        left: 45%;
        top: 45%;
      }

      .loader::before,
      .loader::after {
        content: "";
        grid-area: 1/1;
        border: 8px solid;
        border-radius: 50%;
        border-color: red red #0000 #0000;
        mix-blend-mode: darken;
        animation: l14 1s infinite linear;

      /* From Uiverse.io by gharsh11032000 */
      /* The switch - the box around the slider */
      .switch {
        font-size: 17px;
        position: relative;
        display: inline-block;
        width: 3.5em;
        height: 2em;
      }

      /* Hide default HTML checkbox */
      .switch input {
        opacity: 0;
        width: 0;
        height: 0;
      }

      /* The slider */
      .slider {
        position: absolute;
        cursor: pointer;
        inset: 0;
        border: 2px solid #414141;
        border-radius: 50px;
        transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      }

      .slider:before {
        position: absolute;
        content: "";
        height: 1.4em;
        width: 1.4em;
        left: 0.2em;
        bottom: 0.2em;
        background-color: white;
        border-radius: inherit;
        transition: all 0.4s cubic-bezier(0.23, 1, 0.320, 1);
      }

      .switch input:checked+.slider {
        box-shadow: 0 0 20px rgba(9, 117, 241, 0.8);
        border: 2px solid #0974f1;
      }

      .switch input:checked+.slider:before {
        transform: translateX(1.5em);

    <script type="module">

      document.addEventListener("DOMContentLoaded", async () => {


        //----------------------------All variables that arnt in funcs---------------------
        const container = document.getElementById("button-container");
        const iframe = document.getElementById("fr");
        const fsbContainer = document.getElementById("FSBI");
        const FullScreenBtn = document.getElementById("FullScreenBtn");

        const Title = document.getElementById("Title");
        const titleContainer = document.getElementById("titleContainer");
        const newTabButton = document.getElementById("newTabButton");
        const infoButton = document.getElementById("infoButton");
        const SearchFeild = document.getElementById("SearchFeild");
        const mainInfoButton = document.getElementById("mainInfoButton");
        const mainInfoText = document.getElementById("mainInfoText");
        const activityCount = document.getElementById("activityCount");
        const ActNumTxt = document.getElementById("ActNumTxt");
        const DevMenu = document.getElementById("DevMenu");
        const DevCloseBtn = document.getElementById("DevCloseBtn");
        const BetaActSwitch = document.getElementById('BetaActSwitch');
        const VersionSwitch = document.getElementById('VersionSwitch');
        const htmlUrlSwitch = document.getElementById('htmlUrlSwitch');
        const customActInput = document.getElementById('customActInput');
        const Activitys = document.getElementById("Activitys");
        const Recommended = document.getElementById("Recommended");
        const panicframe = document.getElementById("panicFrame");
        const infoText = document.getElementById("mainInfoText");
        const updateLink = document.getElementById("downloadLink");
        const timestamp = `?t=${Date.now()}`;
        const popText = document.getElementById("popText");
        const mainText = document.getElementById("mainText");

        

        const adBlockInjection = `
    <style>
        /* Uses ^ (starts with) and exact matches to avoid hitting 'loading' */
        [id^="ad-"], [id^="ad_"], [class^="ad-"], [class^="ad_"], .ad, #ad, #sidebarad1, #sidebarad2 { 
            display: none !important; 
            width: 0 !important; 
            height: 0 !important; 
        }
    </style>
    <script>
        window.open = function() { console.log("Ad popup blocked!"); return null; };
    <\/script>
    `;
        // these are hear because im stupid and cant see without them being seporate
        window.currentContentURL = "";
        window.currentContentOfFrame = "";
        window.isHtmlCode = false;
        window.RecommendedEnabled = false;
        window.debugVersionSwitch = 0;
        //more lets because why not

        let allowedKeys = {37: 'left', 38: 'up', 39: 'right', 40: 'down',};
        let konamiCode = ['up', 'up', 'down', 'down', 'left', 'right', 'left', 'right'];
        let konamiCodePosition = 0;
        let isErudaInit = false;
        let Contents = [];
        

        //------------------------------functions------------------------------


        function activateDevMode() {
          DevMenu.style.display = "flex";
        }

       async function searchLoadedActivitys(searchInput) {

                    //for the things in contents, find all that have an id matching the users search, if not kill the item >:3
          for (let i = Contents.length - 1; i >= 0; i--) {
            //had to do some mind hur stuff so user search works for stupid people
            const tempId = Contents[i].name.toLowerCase().replace(/ /g, "");
            const temp = document.getElementById(tempId);

            if (temp) {
              if (!Contents[i].name.toLowerCase().includes(searchInput.toLowerCase())) {
                temp.style.display = "none";
              } else {
                if (RecommendedEnabled == true) {
                  if (Contents[i].isRecommended == "true") {
                    temp.style.display = "";
                  } else {
                    temp.style.display = "none";
                  }
                } else {
                  temp.style.display = "";
                }
              }
            }
          }
          
        }

       async function loadHtmlActivityIntoFrame(htmlActivityUrl) {

                let htmlContent = "";
                try {
                  const response2 = await fetch(htmlActivityUrl);
                  htmlContent = await response2.text();
                } catch (error) {
                  console.error(error);
                }
               
                window.isHtmlCode = true;
                window.currentContentOfFrame = htmlContent;
                //import the html into the iframe
                iframe.src = "about:blank";
                iframe.srcdoc = htmlContent;
         fsbContainer.style.left = "auto";
              backButton.style.left = "720px";
              backButtonw.style.left = "-99720px";

        }

       async function loadEJSActivityIntoFrame(ejsActivityUrl, ejsActivityName, ejsActivityCore) {

                let htmlContent = `<head>
      <style>
        body, html {
        margin: 0;
        padding: 0;
        }
      <\/style>
    <\/head>
    <body>
      <div style="width:100%;height:100%;max-width:100%">
        <div id="Activity"><\/div>
      <\/div>
      <script>
        EJS_DEBUG_XX = true;
        EJS_player = "#Activity";
        EJS_core = "${ejsActivityCore}";
        EJS_ActivityName = "${ejsActivityName}";
        EJS_color = "#0097c4";
        EJS_pathtodata = "https://cdn.emulatorjs.org/latest/data/";
        EJS_ActivityUrl = "${ejsActivityUrl}";
      <\/script>
    
      <script src="https://cdn.emulatorjs.org/latest/data/loader.js"><\/script>
    <\/body>
    `;
               
                window.isHtmlCode = true;
                window.currentContentOfFrame = htmlContent;
                //import the html into the iframe
                
              iframe.src = "about:blank";
              iframe.srcdoc = htmlContent;
              fsbContainer.style.left = "auto";
              backButton.style.left = "720px";
              backButtonw.style.left = "-99720px";
          
        }

       async function loadUrlAcivityIntoFrame(urlActivityUrl) {
                iframe.removeAttribute("srcdoc");
                iframe.src = urlActivityUrl;
                window.isHtmlCode = false; // Set flag for new tab button
                window.currentContentURL = urlActivityUrl;
         fsbContainer.style.left = "auto";
              backButton.style.left = "720px";
              backButtonw.style.left = "-99720px";
         //console.log(window.currentContentURL);
        }

       async function createActivityButton(activityUrl, activityImgUrl, activityName, activityKey, ejsCore ) {


            const group = document.createElement("div");
            const button = document.createElement("button");
            const label = document.createElement("p");
          
            group.className = "button-group";
            group.id = activityName.toLowerCase().replace(/ /g, "");
            button.className = "my-button";
            button.style.background = `url(${activityImgUrl}) no-repeat center center`;
            button.style.backgroundSize = "cover";

            button.addEventListener("click", async () => {
              
              //check if the activity uses raw html
              if (activityKey == "Url") {

                loadUrlActivityIntoFrame(activityUrl);

              } else if (activityKey == "EJS") {
                loadEJSActivityIntoFrame(activityUrl, activityName, ejsCore);

               
              } else {
                loadHtmlActivityIntoFrame(activityUrl);
              }
            });
            //makes the text for the activity buttons
            
            label.innerHTML = `<div class="activityText">${activityName}</div>`;
            group.appendChild(button);
            group.appendChild(label);
            container.appendChild(group);
          }

       async function loadActivities(jsonUrl) {
          container.innerHTML = "";
          Contents = [];
          try {
            const response1 = await fetch(
              jsonUrl + "?t=" + Date.now()
            );
            Contents = await response1.json();
          } catch (error) {
            console.error(error);
          }
          //sorts in abc order
          Contents.sort((a, b) => a.name.localeCompare(b.name));
          //loops though activitys and make a button for each one
          Contents.forEach((Content) => {

          createActivityButton(Content.url, Content.img ,Content.name, Content.key, "");
          });
       }

       async function loadHTMLNewTab(htmlToLoad) {
              let newTab = window.open("", "_blank");
              newTab.document.open();
              newTab.document.write(`
                    <head>
                      <script>
                        window.addEventListener("beforeunload", function (event) {
                          event.preventDefault();
                          event.returnValue = "";
                        });
                      <\/script>
                      <style>
                        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
                        iframe { width: 100%; height: 100%; border: none; }
                      <\/style>
                    <\/head>
                    <body>
                      <iframe id="newTabIframe" sandbox="allow-scripts allow-same-origin"><\/iframe>
                    <\/body>
                    <\/html>`);
              newTab.document.close();
              const newIframe = newTab.document.getElementById("newTabIframe");
              const newIframeDoc = newIframe.contentDocument || newIframe.contentWindow.document;
              //put html content of the Activity into the sandboxed iframe.
              newIframeDoc.open();
              newIframeDoc.write(htmlToLoad);
         //console.log(htmlToLoad);
              newIframeDoc.close();
       }

       async function loadUrlNewTab(urlToLoad) {
            let newTab = window.open("", "_blank");
            newTab.document.write(`
              <head>
                
                <script>
                  window.addEventListener("beforeunload", function (event) {
                    event.preventDefault();
                    event.returnValue = "";
                  });
                <\/script>
                <style>
                  body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
                  iframe { width: 100%; height: 100%; border: none; }
                </style>
              <\/head>
              <body>
                <iframe src="${urlToLoad}"></iframe>
              <\/body>
              <\/html>`);
            
         
       }

       async function checkVersion(versionURL, versionInt) {

          if (debugVersionSwitch == 1)
          {
            window.HtmlVersion = "-1"
          } else {
            window.HtmlVersion = "6";
          }
          window.NewestHtmlVers = versionInt;
          if (infoText) {
            infoText.innerHTML = `
                        Info: <br><br> 
                        Press Shift + \\ to open panic mode. <br> 
                        Current Version: ${window.HtmlVersion} | Newest: ${window.NewestHtmlVers}<br><br>
                        This site is not affiliated with any activities included...
                    `;
          }
          if (versionInt !== window.HtmlVersion) {
            if (confirm("New version available! Download now?")) {
              const updateRes = await fetch(`${versionURL}NewestVersion.html${timestamp}`);
              const blob = new Blob([await updateRes.text()], {
                type: "text/html"
              });
              
              updateLink.href = URL.createObjectURL(blob);
              updateLink.click();
            }
          }
        
      }

       async function loadExternalAssets(baseUrl) {
        //const baseUrl = 'https://cdn.jsdelivr.net/gh/DDD-Dev2/DevSpace@main/';
        
        //set dubug menu url
        const block = document.getElementById("debugUrlCodeBlock");
        block.innerHTML = baseUrl;
        const files = [{
            id: 'version',
            url: `https://cdn.jsdelivr.net/gh/DDD-Dev2/DevSpace@main/HtmlVersion.txt${timestamp}`
          },
          {
            id: 'popout',
            url: `${baseUrl}popoutText.txt${timestamp}`
          },
          {
            id: 'mainMsg',
            url: `${baseUrl}mainMessage.txt${timestamp}`
          }
        ];
        try {
          const results = await Promise.all(files.map(file =>
            fetch(file.url).then(res => res.text())
          ));
          const [versionData, popoutData, mainMsgData] = results.map(t => t.trim());

          checkVersion(baseUrl, versionData);
          window.NewestHtmlVers = versionData;
          
          if (popText) popText.textContent = popoutData;
          if (mainText) mainText.innerHTML = mainMsgData;
          
        } catch (error) {
          console.error("Asset Load Failure:", error);
          mainText.innerHTML = "Error loading latest updates.";
          popText.innerHTML = "Error";
        }
      }


        
        //------------------------------Event Listeners----------------------------------

        //get keydown for debug menu
        document.addEventListener('keydown', function(e) {
          let key = allowedKeys[e.keyCode];
          let requiredKey = konamiCode[konamiCodePosition];
          if (key == requiredKey) {
            konamiCodePosition++;
            if (konamiCodePosition == konamiCode.length) {
              activateDevMode();
              konamiCodePosition = 0;
            }
          } else {
            konamiCodePosition = 0;
          }
        });

        //event list for penic frame.
        document.addEventListener("keydown", (event) => {
          if (event.key === '|') {
            //panicframe.src = "https://www.desmos.com/calculator";
            if (panicframe.requestFullscreen) {
              panicframe.requestFullscreen();
            }
          }
        });

        //event listener for switch to change activity url for all elements.
        BetaActSwitch.addEventListener('change', () => {
          if (BetaActSwitch.checked) {
            loadActivities("https://bitbucket.org/ddd_dev-workspace/dev-space/raw/main/Activitys.json");
            loadExternalAssets('https://bitbucket.org/ddd_dev-workspace/dev-space/raw/main/');
          } else {
            loadExternalAssets('https://cdn.jsdelivr.net/gh/DDD-Dev2/DevSpace@main/');
            loadActivities("https://cdn.jsdelivr.net/gh/DDD-Dev2/DevSpace@main/Activitys.json");
          }
        });

        //event listener for version debug switch.
        VersionSwitch.addEventListener('change', () => {
          if (VersionSwitch.checked) {
            //console.log("switched");
            window.debugVersionSwitch = "1";
             loadExternalAssets('https://cdn.jsdelivr.net/gh/DDD-Dev2/DevSpace@main/');
            loadActivities("https://cdn.jsdelivr.net/gh/DDD-Dev2/DevSpace@main/Activitys.json");
          } else {
            //console.log("switched");
            window.debugVersionSwitch = "0";
             loadExternalAssets('https://cdn.jsdelivr.net/gh/DDD-Dev2/DevSpace@main/');
             loadActivities("https://cdn.jsdelivr.net/gh/DDD-Dev2/DevSpace@main/Activitys.json");
          }
        });

        //event lis for the custon activity input.
        customActInput.addEventListener("keyup", (e) => {
            if (e.key === 'Enter' || e.keyCode === 13) {
             if (htmlUrlSwitch.checked) {
               loadUrlAcivityIntoFrame(customActInput.value);
             } else {
               loadHtmlActivityIntoFrame(customActInput.value);
             }
            }    
          });

        //event list for the search bar.
        SearchFeild.addEventListener("input", function(event) {
          searchLoadedActivitys(SearchFeild.value);
        });

        //debug menu close button
        DevCloseBtn.addEventListener("click", () => {
          DevMenu.style.display = "none";
        });
        
        //inspect element enable button
        erudaEnableBtn.addEventListener("click", () => {
          if (typeof eruda === 'undefined') {
            alert("Eruda failed to load from the CDN.");
            return;
          }
          if (!isErudaInit) {
            eruda.init();
            isErudaInit = true;
          } else {
            // If it's already initialized, just make sure the panel is visible
            
          }
        });

        //enable button for information tab
        mainInfoButton.addEventListener("click", () => {
          mainInfoText.style.left = "auto";
          backButtonI.style.left = "1000px";
        });

        //main activity window button
        Activitys.addEventListener("click", () => {
          ActNumTxt.innerHTML = "" + Contents.length;
          Webports.style.display = "block";
          TC.style.height = "80px";
          PC.style.top = "-999px";
          Title.style.backgroundcolor = "#000f";
          titleContainer.style.height = "5px";
          backButtonw.style.left = "720px";
          SearchFeild.style.left = "15px";
          activityCount.style.display = "flex";
        });

        //recomended activity enable button
        Recommended.addEventListener("click", () => {
          Webports.style.display = "block";
          titleContainer.style.height = "5px";
          TC.style.height = "80px";
          PC.style.top = "-999px";
          Title.style.backgroundcolor = "#000f";
          backButtonw.style.left = "720px";
          SearchFeild.style.left = "15px";
          RecommendedEnabled = true;
          activityCount.style.display = "flex";

          //look for tagged with recomended.
          let temp2 = 0;
          for (let i = Contents.length - 1; i >= 0; i--) {
            //had to do some mind hur stuff so user search works for stupid people
            const tempId = Contents[i].name.toLowerCase().replace(/ /g, "");
            const temp = document.getElementById(tempId);
            if (Contents[i].isRecommended == "true") {
              temp.style.display = "";
              temp2++;
              ActNumTxt.innerHTML = "" + temp2;
            } else {
              temp.style.display = "none";
            }
          }
        });

        //back button for iframe window tab
        backButton.addEventListener("click", () => {
          //back button for main activitys tab, styling and reseting the current activity. so you can actualy switch.
          fsbContainer.style.left = "-20000px";
          backButton.style.left = "-1000px";
          iframe.removeAttribute("srcdoc");
          iframe.src = "about:blank";
          window.currentContentURL = "";
          iframe.contentDocument.innerHTML = "";
          backButtonw.style.left = "720px";
        });

        //back button for info tab i think
        backButtonI.addEventListener("click", () => {
          mainInfoText.style.left = "-20000px";
          backButtonI.style.left = "-1000px";
        });

        //back button for recomended tab
        backButtonw.addEventListener("click", () => {
          //back button for activitys tab, just styling tbh
          Webports.style.display = "none";
          TC.style.height = "150px";
          titleContainer.style.height = "70px";
          PC.style.top = "70px";
          Title.style.backgroundcolor = "#000";
          backButtonw.style.left = "-9999px";
          SearchFeild.style.left = "-99999px";
          activityCount.style.display = "none";
          RecommendedEnabled = false;
          for (let i = Contents.length - 1; i >= 0; i--) {
            const tempId = Contents[i].name.toLowerCase().replace(/ /g, "");
            const temp = document.getElementById(tempId);
            if (Contents[i].isRecommended == "true") {
              temp.style.display = "";
            } else {
              temp.style.display = "";
            }
          }
        });

        //fullscreen button event list
        FullScreenBtn.addEventListener("click", () => {
          if (iframe.requestFullscreen) {
            iframe.requestFullscreen();
          }
        });

        //infor button on games event sist
        infoButton.addEventListener("click", () => {
          alert(
            "Some Activitys can take a while to load. If the Activity doesnt load within 5 mins, put in an add Activity request and add a note asking to fix it."
          );
        });

        //before unload event listener
        window.addEventListener("beforeunload", function(event) {
          event.preventDefault();
          event.returnValue = "";
        });

        //newtab event listener
        newTabButton.addEventListener("click", () => {
            if (window.isHtmlCode) {
              loadHTMLNewTab(window.currentContentOfFrame);
            } else {
              loadUrlNewTab(window.currentContentURL);
            }

        });

//------------------Actual Run On Load--------------------------------------
        
        
        loadActivities("https://cdn.jsdelivr.net/gh/DDD-Dev2/DevSpace@main/Activitys.json");
        loadExternalAssets("https://cdn.jsdelivr.net/gh/DDD-Dev2/DevSpace@main/");
        //closed dom content onload
      });
    </script>
