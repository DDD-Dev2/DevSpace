.loader {
  width: 80px;
  aspect-ratio: 1;
  display: grid;
  animation: l14 4s infinite;
    position:absolute;
left:45%;
    top:45%;
}
.loader::before,
.loader::after {    
  content: "";
  grid-area: 1/1;
  border: 8px solid;
  border-radius: 50%;
  border-color: red red #0000 #0000;
  mix-blend-mode: darken;
  animation: l14 1s infinite linear;
}
.loader::after {
  border-color: #0000 #0000 blue blue;
  animation-direction: reverse;
}
@keyframes l14{ 
  100%{transform: rotate(1turn)}

      .btn a {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        box-shadow: 0 15px 15px rgba(0, 0, 70, 0.3);
        border-bottom: 2px solid rgba(0, 0, 255, 0.7);
        border-top: 2px solid rgba(0, 0, 255, 0.7);
        border-radius: 30px;
        padding: 10px;
        letter-spacing: 1px;
        text-decoration: none;
        overflow: hidden;
        color: #f00;
        font-weight: 800;
        transition: 0.5s;
        backdrop-filter: blur(15px);
        font-size: 20px;
        font-family: "Bowlby One SC", sans-serif;
      }

      .btn:hover a {
        letter-spacing: 3px;
      }

      .btn a::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 50%;
        height: 100%;
        background: linear-gradient(
          to left,
          rgba(0, 0, 255, 0.15),
          transparent
        );
        transform: skewX(45deg) translate(0);
        transition: 1s;
        filter: blur(3px);
      }

      .btn:hover a::before {
        transform: skewX(45deg) translate(200px);
      }

      .btn::before,
      .btn::after {
        content: "";
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        width: 30px;
        height: 10px;
        background: #00f;
        border-radius: 10px;
        transition: 0.5s;
        transition-delay: 0.5s;
      }

      .btn:hover::before,
      .btn:hover::after {
        border-radius: 30px;
      }

      .btn::before {
        bottom: -5px;
      }

      .btn::after {
        top: -5px;
      }
